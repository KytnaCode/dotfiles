#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 3, 4]
sort_by = "alphabetical"
linemode = "size"
mouse_events = ["click", "scroll", "drag"]

[preview]
image_quality = 60

[opener]
edit = [
  { run = "${EDITOR:-vi} %s", desc = "$EDITOR", for = "unix", block = true },
]
play = [{ run = "xdg-open %s1", desc = "Play", for = "linux", orphan = true }]
open = [{ run = "xdg-open %s1", desc = "Open", for = "linux" }]
reveal = [
  { run = "xdg-open %d1", desc = "Reveal", for = "linux" },
  { run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]
extract = [{ run = "ya pub extract --list %s", desc = "Extract here" }]
download = [
  { run = "ya emit download --open %S", desc = "Download and open" },
  { run = "ya emit download %S", desc = "Download" },
]
trash = [
  { run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
  { run = "ya pub trash-empty --list %S", desc = "Empty trash bin" },
]

[open]
rules = [
  # Folder
  { mime = "folder/*", use = [
    "edit",
    "open",
    "reveal",
  ] },
  # Text
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  # Image
  { mime = "image/*", use = [
    "open",
    "reveal",
  ] },
  # Media
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
  ] },
  # Code
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [
    "edit",
    "reveal",
  ] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
  ] },
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  # Virtual file system
  { mime = "vfs/{absent,stale}", use = "download" },
  # Trash
  { mime = "trash/**", use = [
    "open",
    "trash",
  ] },
  # Fallback
  { url = "*", use = [
    "open",
    "reveal",
  ] },
]

[input]
cursor_blink = true
