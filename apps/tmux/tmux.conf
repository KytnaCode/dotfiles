# Prefix key.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Options
set -g mouse on # Enable mouse.
set-window-option -g mode-keys vi # Set vi keys in copy mode.
set -sg escape-time 0 # Fix Esc+ keymaps.
set -g default-terminal tmux-256colors # Enable 256 colors.
set -ga terminal-overrides ",*256col*:Tc" # Enable true color.
set -g renumber-windows on # Renumber windows.

# Bindings.

## Copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugins.
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'
