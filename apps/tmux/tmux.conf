# Prefix key.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Options
set -g mouse on # Enable mouse.
set-window-option -g mode-keys vi # Set vi keys in copy mode.
set -sg escape-time 0 # Fix Esc+ keymaps.
set -g default-terminal tmux-256color # Enable 256 colors.
set -ga terminal-overrides ",*256col*:Tc" # Enable true color.
set -g renumber-windows on # Renumber windows.

## Base index.
set -g base-index 1
set -g pane-base-index 1

## Mouse mode.
set -g mouse on
set -g @scroll-down-exit-copy-mode "off"
set -g @scroll-without-changing-pane "on"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# Bindings.

## Copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Easy motion.
set -gu @easy-motion-binding-bd-f
set -g @easy-motion-binding-bd-f2 's'

# Statusline

set -g status-left-length 100
set -g status-right-length 100

set -g @section_a_content "#{T:@yume_status_session}"
set -g @section_b_content "#{E:@yume_status_git}"

set -g @section_y_content "#{E:@yume_status_date}"
set -g @section_z_content "#{E:@yume_status_cpu}"

# Plugins.
set -g @plugin 'kytnacode/tmux-yume'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

run '~/.tmux/plugins/tpm/tpm'
