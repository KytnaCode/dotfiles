# Prefix key.

## Use C-a as prefix.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Options

## Pane and window indexing.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Renumber windows.

## Sessions
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

## Mouse mode.
set -g mouse on
set -g @scroll-down-exit-copy-mode "off"
set -g @scroll-without-changing-pane "on"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

## Statusline
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

set -g @section_a_content "#{T:@yume_status_session}"
set -g @section_b_content "#{E:@yume_status_git}"

set -g @section_y_content "#{E:@yume_status_date}"
set -g @section_z_content "#{E:@yume_status_cpu}"

## Misc
set -sg escape-time 0 # Fix Esc+ keymaps.
set -g default-terminal tmux-256color # Enable 256 colors.
set -ga terminal-overrides ",*256col*:Tc" # Enable true color.
set -g history-limit 50000
set -g display-time 5000
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on

# Bindings.

## Copy mode.
setw -g mode-keys vi # Set vi keys in copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

## Easy motion.
set -gu @easy-motion-binding-bd-f
set -g @easy-motion-binding-bd-f2 's'

## Sessions
set -g @resurrect-restore 'C-t'
set -g @continuum-restore 'on'

## Windows
bind n new-window
bind C-r command-prompt -I "#W" "rename-window '%%'"
bind C-k swap-window
bind , previous-window
bind . next-window

## Panes
bind '-' split-window -v
bind '\' split-window -h
bind x kill-pane

### Vi style keymaps
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins.
set -g @plugin 'kytnacode/tmux-yume'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

run '~/.tmux/plugins/tpm/tpm'
