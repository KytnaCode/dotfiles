#"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[](carnation_pink)\
[($username )($hostname )$directory](fg:alabaster_pink bg:carnation_pink)\
[](carnation_pink)\
$bun\
$golang\
$python\
( [](white_rose_dust)\
$git_branch\
$git_state\
[](white_rose_dust))\
$cmd_duration\
$status\
$fill\
$battery\
$git_commit\
$nix_shell
$character
"""

palette = "yume"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
empty_symbol = "󰂎 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 20
discharging_symbol = "󰥇"
style = "coral_pink"

[[battery.display]]
threshold = 30
discharging_symbol = "󰁼"
style = "cream_chiffon"

[[battery.display]]
threshold = 40
discharging_symbol = "󰁽"
style = "cream_chiffon"

[[battery.display]]
threshold = 50
discharging_symbol = "󰁾"
style = "cream_chiffon"

[[battery.display]]
threshold = 60
discharging_symbol = "󰁿"
style = "cream_chiffon"

[[battery.display]]
threshold = 70
discharging_symbol = "󰂀"
style = "cream_chiffon"

[[battery.display]]
threshold = 80
discharging_symbol = "󰂁"
style = "hint_of_mint"

[[battery.display]]
threshold = 90
discharging_symbol = "󰂂"
style = "hint_of_mint"

[[battery.display]]
threshold = 100
discharging_symbol = "󰁹"
style = "hint_of_mint"

[character]
format = "$symbol "
success_symbol = "[](hint_of_mint)"
error_symbol = "[](bold coral_pink)"

[fill]
symbol = " "

[username]
show_always = false
format = "[$user]($style)"
style_root = "$style_user"
style_user = "bold fg:alabaster_pink bg:carnation_pink"

[hostname]
format = "[at $hostname]($style)"
ssh_only = true
style = "fg:alabaster_pink bg:carnation_pink"

[directory]
format = "[on $path ]($style)[$read_only]($read_only_style) "
style = "fg:alabaster_pink bg:carnation_pink"
read_only_style = "bold $style"

[bun]
format = """
 [](white_rose_dust)\
[ via bun ($version) ]($style)\
[](white_rose_dust)\
"""
style = "fg:text bg:white_rose_dust"

[cmd_duration]
format = " [took $duration]($style)"
style = "text"
show_notifications = true
min_time_to_notify = 30000

[git_branch]
format = "[ on $symbol$branch(:$remote_branch) ]($style)"
style = "fg:text bg:white_rose_dust"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style)'
style = 'bold fg:info bg:white_rose_dust'

[git_commit]
format = '[\($hash\)]($style)'
style = "subtext"

[golang]
format = """
 [](white_rose_dust)\
[ via Go ($version) ]($style)\
[](white_rose_dust)\
"""
style = "fg:text bg:white_rose_dust"

[nix_shell]
format = """
[](white_rose_dust)\
[$state( \\($name\\) )]($style)\
[](white_rose_dust)\
"""
style = "fg:text bg:white_rose_dust"

[python]
format = """
 [](white_rose_dust)\
[ via Python ($version) ]($style)\
[](white_rose_dust)\
"""
style = "fg:text bg:white_rose_dust"

[status]
format = " [exit code: $status]($style) "
disabled = false
style = "bold fg:errpr"

